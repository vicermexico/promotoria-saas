<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/isologo_promotoria_AM.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c2b33" />
    <link rel="apple-touch-icon" href="/icons/chofer2-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Promotoría" />
    <title>Promotoria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica el tema antes del primer render para evitar el "flash" de tema incorrecto.
      // NOTA: tema oscuro deshabilitado temporalmente, debe coincidir con
      // DARK_THEME_ENABLED en src/hooks/useTheme.ts. Al reactivarlo, poner
      // DARK_THEME_ENABLED en true aquí también.
      (function () {
        try {
          var DARK_THEME_ENABLED = false;
          var t = localStorage.getItem("app-theme");
          var dark =
            DARK_THEME_ENABLED &&
            (t === "dark" ||
              (t === "system" &&
                window.matchMedia("(prefers-color-scheme: dark)").matches));
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
